<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>Catch the Thief</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:white;font-family:Arial;text-align:center}h2{margin:12px}.hud{display:flex;justify-content:space-around;padding:8px}canvas{display:block;width:100%;max-width:480px;height:62vh;margin:auto;background:#344054;touch-action:none}.controls{display:flex;justify-content:center;gap:18px;padding:12px}button{font-size:22px;padding:12px 25px;border:0;border-radius:12px;background:#2563eb;color:white}#msg{padding:4px}</style></head><body><h2>🚓 Catch the Thief</h2><div class="hud"><span>Score: <b id="score">0</b></span><span>Stage: <b id="stage">1</b></span></div><canvas id="game" width="400" height="600"></canvas><div id="msg">Catch the red car!</div><div class="controls"><button id="left">◀</button><button id="start">START / RESTART</button><button id="right">▶</button></div><script>
const c=document.getElementById('game'),x=c.getContext('2d');let px=180,tx=180,py=490,ty=130,score=0,run=false,dir=0,traffic=[];const scoreEl=document.getElementById('score');function car(a,b,color){x.fillStyle=color;x.fillRect(a,b,40,72);x.fillStyle='#cbd5e1';x.fillRect(a+6,b+9,28,17);x.fillRect(a+6,b+47,28,14);x.fillStyle='#111827';x.fillRect(a-3,b+12,5,16);x.fillRect(a+38,b+12,5,16);x.fillRect(a-3,b+48,5,16);x.fillRect(a+38,b+48,5,16)}function draw(){x.fillStyle='#344054';x.fillRect(0,0,400,600);x.fillStyle='#202938';x.fillRect(35,0,330,600);x.strokeStyle='#f8fafc';x.setLineDash([28,24]);x.lineWidth=4;x.beginPath();x.moveTo(200,0);x.lineTo(200,600);x.stroke();x.setLineDash([]);car(tx,ty,'#dc2626');car(px,py,'#2563eb');if(run){tx+=Math.sin(Date.now()/500)*1.7;ty+=1.15;if(ty>600){ty=-80;score+=10;scoreEl.textContent=score;document.getElementById('stage').textContent=1+Math.floor(score/50)}px+=dir*4;px=Math.max(42,Math.min(318,px));if(Math.abs(px-tx)<35&&Math.abs(py-ty)<60){run=false;document.getElementById('msg').textContent='Caught! Score: '+score+' — press START to play again.'}}requestAnimationFrame(draw)}document.getElementById('left').onpointerdown=()=>dir=-1;document.getElementById('right').onpointerdown=()=>dir=1;for(const id of ['left','right'])document.getElementById(id).onpointerup=()=>dir=0;document.getElementById('start').onclick=()=>{px=180;tx=180;ty=100;score=0;scoreEl.textContent=0;run=true;document.getElementById('msg').textContent='Chase the red car!'};draw();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker فعال شو:', reg.scope))
      .catch(err => console.error(err));
  });
}
</script>
</body></html>
