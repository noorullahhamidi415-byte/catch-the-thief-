<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101820">
<meta name="description" content="Catch the Thief - Fun mobile chase game">
<link rel="manifest" href="manifest.webmanifest">
<title>Catch the Thief</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial;text-align:center}
h2{color:#ffd700}
canvas{background:#263238;border:3px solid white;border-radius:12px;width:95%;max-width:420px;touch-action:none}
button{padding:14px 25px;margin:8px;border:0;border-radius:10px;background:#ffd700;font-size:18px;font-weight:bold}
#info{font-size:20px;margin:10px}
</style>
</head>
<body>
<h2>🚓 CATCH THE THIEF 🚨</h2>
<div id="info">Score: <span id="score">0</span></div>
<canvas id="game" width="400" height="600"></canvas>
<div>
<button onclick="move(-1)">⬅️ LEFT</button>
<button onclick="move(1)">RIGHT ➡️</button>
</div>
<button onclick="restart()">START / RESTART</button>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
let player=175,thief=175,ty=50,score=0,speed=3,over=false;
function drawCar(x,y,color,label){
ctx.fillStyle=color;ctx.fillRect(x,y,50,85);
ctx.fillStyle="white";ctx.fillRect(x+8,y+12,34,18);
ctx.fillStyle="black";ctx.fillRect(x+5,y+65,10,12);ctx.fillRect(x+35,y+65,10,12);
ctx.fillStyle="white";ctx.font="12px Arial";ctx.fillText(label,x+5,y+48);
}
function draw(){
ctx.clearRect(0,0,400,600);
ctx.strokeStyle="white";ctx.setLineDash([30,25]);ctx.lineWidth=4;
ctx.beginPath();ctx.moveTo(200,0);ctx.lineTo(200,600);ctx.stroke();ctx.setLineDash([]);
drawCar(player,490,"#2196f3","POLICE");
drawCar(thief,ty,"#e53935","THIEF");
if(!over){
ty+=speed;
if(ty>510){
if(Math.abs(thief-player)<55){over=true;ctx.fillStyle="white";ctx.font="30px Arial";ctx.fillText("GAME OVER",100,300);}
else{score++;document.getElementById("score").textContent=score;ty=-100;thief=Math.random()*340;speed=Math.min(8,speed+.2);}
}
requestAnimationFrame(draw);
}
}
function move(d){player=Math.max(0,Math.min(350,player+d*45));}
function restart(){player=175;thief=Math.random()*340;ty=50;score=0;speed=3;over=false;document.getElementById("score").textContent=0;draw();}
draw();
</script>
</body>
</html>
